title: "API Health Checker"
category: "HTTP/API"
difficulty: 2
xp: 220
story: |
  The uptime monitor checks API endpoints, but the status checking logic is
  wrong — healthy services are reported as down and errors are swallowed.
objective: "Fix the 2 bugs in the API health checker."
hints:
  - "HTTP 2xx status codes indicate success — check the range"
  - "Exceptions from requests should be re-raised or logged, not silently ignored"
check_function: "check_endpoint"
