title: "SSH Key Validator"
category: "Security"
difficulty: 2
xp: 220
story: |
  The CI/CD system validates SSH public keys before adding them to authorized_keys.
  The validator accepts invalid keys and rejects valid ones. Fix it.
objective: "Fix the 2 bugs in the SSH key validator."
hints:
  - "SSH public keys have exactly 3 parts: type, base64-data, comment"
  - "Valid key types are ssh-rsa, ssh-ed25519, ecdsa-sha2-nistp256"
check_function: "validate_ssh_key"
