title: "Dynamic Plugin Loader"
category: "Metaprogramming"
difficulty: 3
xp: 250
story: |
  The plugin system dynamically loads Python modules as plugins. The loader
  crashes on import errors and doesn't validate the plugin interface.
objective: "Fix the 2 bugs in the plugin loader."
hints:
  - "Use importlib.import_module() to dynamically import by name"
  - "Check hasattr() to verify the plugin implements required methods"
check_function: "load_plugin"
