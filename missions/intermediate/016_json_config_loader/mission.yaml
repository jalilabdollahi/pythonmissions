title: "JSON Config Loader"
category: "File I/O"
difficulty: 2
xp: 200
story: |
  Services are failing to start because the config loader isn't reading JSON
  properly. Two bugs are preventing valid configs from loading.
objective: "Fix the 2 bugs in the JSON config loader."
hints:
  - "json.loads() reads a string; json.load() reads a file object"
  - "Missing keys should return a default, not raise an exception"
check_function: "load_config"
