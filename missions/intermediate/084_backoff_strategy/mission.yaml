title: "Exponential Backoff"
category: "Patterns"
difficulty: 2
xp: 230
story: |
  The retry system uses exponential backoff with jitter to avoid thundering
  herd, but the formula is wrong and jitter isn't applied.
objective: "Fix the 2 bugs in the backoff strategy."
hints:
  - "Exponential backoff: base * (2 ** attempt)"
  - "Add random jitter: random.uniform(0, cap) to spread retries"
