title: "JSON Config Files"
category: "JSON"
difficulty: 3
xp: 200
story: |
  Your service reads its configuration from a JSON file
  and saves updated settings back. The config module is broken -
  it reads fine but writes produce garbage (a string, not a file).
  Fix it before the next deploy.
description: |
  The script loads and saves a JSON configuration file.

  There are 2 bugs:
    1. When saving, the file is opened with mode "r" (read-only).
       To write a file, use mode "w".
    2. `json.dumps()` returns a STRING. To write directly to a file
       object, use `json.dump(data, f)` - note: no 's'.
hints:
  - "To write to a file, open it with mode 'w', not 'r'."
  - "json.dumps() -> returns a string. json.dump(obj, file) -> writes to a file. You need dump()."
  - "Fix: open(path, 'r') -> open(path, 'w')  and  json.dumps(config, f) -> json.dump(config, f)"
tags:
  - json
  - file-io
  - config
  - serialization
