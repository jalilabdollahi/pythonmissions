title: "API Pagination Handler"
category: "HTTP/API"
difficulty: 2
xp: 230
story: |
  The API client fetches paginated results but stops after the first page
  and calculates total pages incorrectly.
objective: "Fix the 2 bugs in the pagination handler."
hints:
  - "Ceiling division for pages: -(-total // per_page) or math.ceil()"
  - "Continue fetching while there are more pages, not just the first"
check_function: "fetch_all_pages"
