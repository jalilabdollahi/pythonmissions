title: "Circuit Breaker"
category: "Patterns"
difficulty: 3
xp: 250
story: |
  The circuit breaker protects downstream services from cascading failures,
  but it never opens and doesn't reset correctly. Fix the state machine.
objective: "Fix the 2 bugs in the circuit breaker."
hints:
  - "The circuit should OPEN after reaching the failure threshold"
  - "In HALF_OPEN state, a success should close the circuit"
