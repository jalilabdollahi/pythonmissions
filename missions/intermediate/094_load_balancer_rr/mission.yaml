title: "Round-Robin Load Balancer"
category: "Networking"
difficulty: 2
xp: 230
story: |
  The load balancer distributes requests across healthy servers in round-robin.
  The selection index overflows and unhealthy servers get traffic.
objective: "Fix the 2 bugs in the round-robin load balancer."
hints:
  - "Use modulo (%) to wrap the round-robin index"
  - "Only route to servers that are marked healthy"
check_function: "RoundRobinLB"
