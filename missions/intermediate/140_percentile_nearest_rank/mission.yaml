title: Nearest Rank Percentiles
category: Metrics
difficulty: 3
xp: 200
story: |
  The Harbor SRE team reports p50, p95 and p99 latency for every release. The
  p100 call crashes with an IndexError, p95 of a small sample picks the wrong request,
  and results depend on whether the samples arrived sorted.
description: |
  `percentile(samples, p)` returns the nearest-rank percentile: sort the samples, compute
  `rank = ceil(p / 100 * n)` (at least 1) and return the element at that 1-based rank. `p` must be
  within 0-100 and samples must not be empty, otherwise `ValueError`. The input list must not be modified.
  `latency_summary(samples)` returns `{"p50":..., "p95":..., "p99":..., "max":...}`. There are 3 bugs.
hints:
  - |
    Hint 1: Ask for p50, p95 and p100 of `[15, 20, 35, 40, 50]` and then shuffle the list and ask again.
  - |
    Hint 2: Nearest rank is 1-based, so index is rank - 1. The rule uses ceil, not int. Also look at what happens for an empty list and for p equal to zero.
  - |
    Hint 3: `ordered = sorted(samples)`; `rank = max(1, math.ceil(p / 100 * len(ordered)))`; `return ordered[rank - 1]`; raise ValueError for empty input.
tags: [percentile, statistics, sorting, indexing]
lesson: |
  The nearest-rank method defines the p-th percentile as the value at 1-based rank `ceil(p/100 * n)` of the sorted data. Two details cause
  most bugs: ranks start at 1 while Python indices start at 0, and `ceil` rounds up where `int` truncates, which moves p95 of 20 samples
  to the wrong element. You must sort first, because percentiles are about order, and sort a copy so that the caller's list is untouched. Rejecting empty
  input beats returning a made-up zero that looks like a great latency.
mistakes:
  - Using `int(p / 100 * n)` as the index, which is off by one and overflows at p=100.
  - Sorting in place with `samples.sort()` and surprising the caller.
