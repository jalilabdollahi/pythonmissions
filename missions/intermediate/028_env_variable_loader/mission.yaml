title: "Environment Variable Loader"
category: "Configuration"
difficulty: 2
xp: 200
story: |
  Services read config from environment variables, but the loader crashes on
  missing vars and doesn't convert types. Fix the env loader.
objective: "Fix the 2 bugs in the environment variable loader."
hints:
  - "os.environ[] raises KeyError — use os.environ.get() with a default"
  - "Environment variables are always strings — cast to int when needed"
