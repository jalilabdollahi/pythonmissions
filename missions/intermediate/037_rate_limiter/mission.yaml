title: "Token Bucket Rate Limiter"
category: "Algorithms"
difficulty: 3
xp: 240
story: |
  The API gateway uses a token bucket rate limiter to prevent abuse,
  but tokens are not being refilled and the bucket can overflow.
objective: "Fix the 2 bugs in the rate limiter."
hints:
  - "Token refill should cap at max_tokens, not accumulate infinitely"
  - "Track last_refill time to calculate how many tokens to add"
check_function: "TokenBucket"
