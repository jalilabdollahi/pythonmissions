title: "Singleton Config Manager"
category: "Patterns"
difficulty: 2
xp: 220
story: |
  The config manager should be a singleton — one instance shared across all
  modules. But every call creates a new instance. Fix the singleton pattern.
objective: "Fix the 2 bugs in the singleton implementation."
hints:
  - "Store the instance as a class variable, check it in __new__"
  - "__new__ must return the instance; __init__ may be called multiple times"
check_function: "ConfigManager"
