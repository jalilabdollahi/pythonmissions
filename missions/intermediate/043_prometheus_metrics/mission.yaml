title: "Prometheus Metrics Exporter"
category: "Monitoring"
difficulty: 2
xp: 220
story: |
  The Prometheus exporter is misconfigured — counters are being used as
  gauges and labels are missing. Fix the metrics setup.
objective: "Fix the 2 bugs in the Prometheus metrics setup."
hints:
  - "Use prometheus_client.Gauge for values that go up and down (e.g. active connections)"
  - "Counter.inc() increments by 1; use Counter.inc(amount) for custom amounts"
check_function: "setup_metrics"
