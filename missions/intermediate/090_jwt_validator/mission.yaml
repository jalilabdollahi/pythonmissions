title: "JWT Token Validator"
category: "Security"
difficulty: 3
xp: 260
story: |
  The API gateway validates JWT tokens before routing requests. The
  validator has bugs that allow expired tokens and skip signature verification.
objective: "Fix the 2 bugs in the JWT validator."
hints:
  - "Always verify the signature — never skip it"
  - "Check exp claim: if exp < current time, the token is expired"
check_function: "validate_jwt"
