title: "Log Secret Masker"
category: "Security"
difficulty: 2
xp: 230
story: |
  Before logs are shipped, secrets must be masked. The masker is using
  wrong regex groups and the replacement logic is inverted.
objective: "Fix the 2 bugs in the secret masker."
hints:
  - "re.sub() replaces the entire match — use groups to preserve key name"
  - "The replacement should mask the value, not the key"
check_function: "mask_secrets"
