title: "HTTP Health Check"
category: "requests"
difficulty: 3
xp: 200
story: |
  Your monitoring script checks whether microservices are up.
  It's supposed to hit each service's /health endpoint and
  report back. But it's been silently reporting everything as
  "healthy" - even when services are down. Fix it.
description: |
  The script calls an HTTP endpoint and returns a status dict.

  There are 2 bugs:
    1. `response.status` does not exist in the requests library.
       The correct attribute is `response.status_code`.
    2. The requests.get() call has no timeout. This means it can
       hang forever. Add `timeout=5` to the call.
hints:
  - "The requests library uses .status_code, not .status"
  - "Always pass a timeout to requests.get(). Without it, the script can hang forever."
  - "Fix: response.status -> response.status_code  and  add timeout=5 to requests.get()"
tags:
  - requests
  - http
  - health-check
  - api
