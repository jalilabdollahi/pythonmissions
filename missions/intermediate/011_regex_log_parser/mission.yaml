title: "Regex Log Parser"
category: "Regex"
difficulty: 2
xp: 200
story: |
  The monitoring system is drowning in nginx access logs. Your task is to parse
  them using regex and extract useful statistics — but the regex patterns are broken.
objective: "Fix the 2 bugs in the regex log parser."
hints:
  - "Check the regex group names — they must match what the code accesses"
  - "The status code group is missing from the pattern"
check_function: "parse_log_line"
