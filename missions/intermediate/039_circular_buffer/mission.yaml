title: "Circular Log Buffer"
category: "Data Structures"
difficulty: 2
xp: 220
story: |
  The logging subsystem uses a circular buffer to keep the last N log entries
  in memory. The buffer wraps incorrectly and loses entries.
objective: "Fix the 2 bugs in the circular buffer."
hints:
  - "The write index should wrap around using modulo: index % capacity"
  - "When the buffer is full, size stays at capacity, not capacity+1"
check_function: "CircularBuffer"
