title: "Webhook Dispatcher"
category: "HTTP/API"
difficulty: 2
xp: 230
story: |
  The webhook system dispatches events to registered URLs. The dispatcher
  sends to wrong URLs and doesn't validate the response.
objective: "Fix the 2 bugs in the webhook dispatcher."
hints:
  - "The payload should be sent as JSON, not form data"
  - "Check response status_code, not response.ok string"
check_function: "dispatch_webhook"
