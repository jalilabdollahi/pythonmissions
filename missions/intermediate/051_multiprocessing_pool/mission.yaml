title: "Multiprocessing Pool"
category: "Concurrency"
difficulty: 3
xp: 250
story: |
  The image processing pipeline needs to use all CPU cores, but the
  multiprocessing pool is misconfigured and tasks are running serially.
objective: "Fix the 2 bugs in the multiprocessing pool setup."
hints:
  - "pool.map() distributes work; pool.apply() runs one task"
  - "Always use if __name__ == '__main__' guard with multiprocessing"
check_function: "process_batch"
