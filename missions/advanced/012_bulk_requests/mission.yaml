title: "Bulk API Requests"
category: "Threading"
difficulty: 4
xp: 300
story: |
  You need to check 50 service endpoints simultaneously.
  Doing them one by one takes too long. A previous engineer
  started writing a concurrent checker using ThreadPoolExecutor,
  but the results list is always empty. Fix it.
description: |
  The script uses concurrent.futures.ThreadPoolExecutor to check
  multiple URLs in parallel and collect all results.

  There are 2 bugs:
    1. `executor.map()` returns an iterator - you must consume it
       (e.g. with `list()`) to actually run the tasks and get results.
       Without this, the futures are never executed.
    2. A shared `results` list is appended from multiple threads without
       a lock - this is a race condition. Remove the shared list approach
       and use the return value of executor.map() instead.
hints:
  - "executor.map() is lazy - it returns an iterator. Wrap it with list() to execute and collect results."
  - "Appending to a shared list from threads is a race condition. Use the return value of map() directly."
  - "Fix: return list(executor.map(check_url, urls)) - no shared list needed."
tags:
  - threading
  - concurrent.futures
  - parallel
  - api
