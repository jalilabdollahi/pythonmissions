story: |
  The multi-tenant system isolates resources per tenant with quotas.
  Quota enforcement and tenant data isolation are broken.
objective: "Fix the 2 bugs in the multi-tenant isolation system."
hints:
  - "Enforce quota BEFORE allowing the operation, not after"
  - "Each tenant must only see their own data — always filter by tenant_id"
