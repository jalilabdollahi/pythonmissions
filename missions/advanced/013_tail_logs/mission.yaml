title: "Tail the Log File"
category: "File I/O"
difficulty: 4
xp: 300
story: |
  You need to watch a log file in real time - like `tail -f`.
  The script is supposed to seek to the end of the file and
  yield new lines as they appear. But it always starts from
  the beginning and burns 100% CPU. Fix it.
description: |
  The `tail_file(filepath, poll_interval)` generator seeks to the
  end of a file and yields new lines as they are written.

  There are 2 bugs:
    1. `f.seek(0, 2)` is correct for seeking to end (SEEK_END=2), BUT
       the current code uses `f.seek(2, 0)` - the arguments are swapped.
       Correct signature: seek(offset, whence) where whence=2 means end-of-file.
    2. The polling loop has no sleep - it spins at 100% CPU.
       Add `time.sleep(poll_interval)` inside the loop when no new data is found.
hints:
  - "file.seek(offset, whence): to go to end use seek(0, 2) not seek(2, 0). The order matters."
  - "Without time.sleep(), the loop spins at 100% CPU. Sleep when there's nothing new to read."
  - "Fix: f.seek(0, 2) and add time.sleep(poll_interval) in the else branch."
tags:
  - file-io
  - seek
  - tail
  - generators
  - polling
