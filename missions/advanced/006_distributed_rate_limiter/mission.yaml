title: "Distributed Rate Limiter"
category: "Distributed Systems"
difficulty: 4
xp: 350
story: |
  You're building a distributed rate limiter for a multi-region API gateway.
  The implementation uses Redis sliding window, but the Lua script and key
  management have critical bugs causing incorrect limiting across nodes.
objective: "Fix the 2 bugs in the distributed rate limiter."
hints:
  - "The Redis key must include both the identifier and the current window"
  - "EXPIRE should be set to window_seconds, not to the limit"
check_function: "DistributedRateLimiter"
