title: "Continuous Deployment Engine"
category: "DevOps"
difficulty: 5
xp: 450
story: |
  You are the final boss. The CD engine orchestrates deployments across
  environments with promotion gates. The promotion logic and rollback
  triggers are broken, risking production deployments without validation.
objective: "Fix the 2 bugs in the CD engine."
hints:
  - "Promote to next environment only if ALL gate checks pass"
  - "Automatic rollback should trigger when health check FAILS, not succeeds"
check_function: "CDEngine"
