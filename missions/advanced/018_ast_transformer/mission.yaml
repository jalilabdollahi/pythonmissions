title: "AST Code Transformer"
category: "Metaprogramming"
difficulty: 5
xp: 400
story: |
  The code analysis tool uses Python's ast module to instrument functions
  with timing. The AST visitor and node transformer have bugs.
objective: "Fix the 2 bugs in the AST transformer."
hints:
  - "ast.NodeTransformer.generic_visit() must be called to recurse into children"
  - "After modifying an AST, call ast.fix_missing_locations() before compile()"
check_function: "TimingTransformer"
