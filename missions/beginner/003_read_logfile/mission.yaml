title: "Read the Logfile"
category: "File I/O"
difficulty: 2
xp: 100
story: |
  Production is on fire. You need to scan a log file and count
  how many ERROR lines there are - and grab the last 10 lines
  for context. The script is broken. Every second counts.
description: |
  The script reads a log file and provides two functions:
    - count_errors(filepath): counts lines containing "ERROR"
    - last_lines(filepath, n): returns the last n lines

  There are 2 bugs:
    1. Python strings have no `.contains()` method.
       Use the `in` operator instead: `"ERROR" in line`
    2. `lines[n:]` returns everything FROM index n.
       To get the LAST n lines, use `lines[-n:]`
hints:
  - "Python strings don't have a .contains() method. Use: if 'ERROR' in line"
  - "lines[10:] means 'skip first 10'. lines[-10:] means 'last 10'."
  - "Fix: replace line.contains('ERROR') with 'ERROR' in line, and lines[n:] with lines[-n:]"
tags:
  - file-io
  - strings
  - lists
  - slicing
