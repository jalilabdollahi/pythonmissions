story: |
  The inventory extracts hostnames from a list of endpoint dicts.
  The comprehension has the wrong field name.
description: |
  get_hostnames(endpoints) returns list of hostname values.
  Bug: accesses e['host'] but the key is 'hostname'.
hints:
