title: "Count the Queue Items"
category: "OOP"
difficulty: 1
xp: 100
story: |
  The TaskQueue should support len() to count pending tasks.
  len(queue) raises TypeError because __len__ is not defined.
description: |
  TaskQueue.__len__ returns the number of tasks in _tasks list.
  Bug: __len__ method is missing from the class.
hints:
  - "len(obj) calls obj.__len__()."
  - "Add def __len__(self): return len(self._tasks) to the class."
  - "Without __len__, len() raises TypeError."
tags:
  - oop
  - __len__
  - dunder
