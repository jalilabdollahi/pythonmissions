title: "Search the Registry"
category: "Loops"
difficulty: 1
xp: 100
story: |
  The service registry searcher should print 'not found' when a service
  is missing. Instead it always prints 'not found' even for existing services.
description: |
  find_service(registry, name) prints the service or 'not found'.
  Bug: the 'else' is attached to the 'if' instead of the 'for' loop.
hints:
  - "'for...else' runs the else block only if the loop completed without break."
  - "The else clause should be indented to match the for, not the if."
  - "Dedent the 'else' block so it belongs to the 'for' loop, not the 'if'."
tags:
  - loops
  - for-else
  - control-flow
