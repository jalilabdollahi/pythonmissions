title: "Mask the Secret"
category: "Strings"
difficulty: 1
xp: 100
story: |
  Secrets must be logged with only the last 4 chars visible,
  rest replaced with '*'. The masker is returning the full secret.
description: |
  mask_secret(s) masks all but last 4 chars with '*'.
  Bug: s[:-4] gives the part to keep visible; it should be the part to mask.
hints:
  - "s[:-4] is everything except the last 4 characters."
  - "You want to show the last 4: s[-4:]"
  - "Return '*' * (len(s)-4) + s[-4:]."
tags:
  - strings
  - slicing
  - security
