title: "Initialize the Subclass"
category: "OOP"
difficulty: 1
xp: 100
story: |
  The MonitoredService subclass extends Service but doesn't call the
  parent __init__, so name and host are never set.
description: |
  MonitoredService(name, host, port, check_interval) calls super().__init__.
  Bug: super().__init__() is not called.
hints:
  - "Subclasses must call super().__init__() to initialize the parent."
  - "Without it, self.name and self.host from the parent are never set."
  - "Add super().__init__(name, host, port) as the first line of __init__."
tags:
  - oop
  - inheritance
  - super
