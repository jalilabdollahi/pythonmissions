title: "Iterate the IP Range"
category: "OOP"
difficulty: 1
xp: 100
story: |
  The IPRange class should support iteration over IPs in a range.
  __next__ is missing — the iterator raises StopIteration immediately.
description: |
  IPRange implements __iter__ and __next__ for sequential IPs.
  Bug: __next__ is missing from the class.
hints:
  - "Iterators need both __iter__ (returns self) and __next__."
  - "__next__ should return the next value or raise StopIteration when done."
  - "Add a __next__ method that increments self.current and raises StopIteration at end."
tags:
  - oop
  - iterator
  - __next__
