title: "Slice the Version"
category: "Strings"
difficulty: 1
xp: 100
story: |
  The deployment script extracts the major version from a version string
  like '2.14.3'. It should return '2' but returns '' instead.
description: |
  get_major(version) returns everything before the first dot.
  Bug: slice [1:] skips the first character instead of [0:idx] before the dot.
hints:
  - "Find the index of '.' then slice up to that index."
  - "Use version.find('.') to get the dot position, then slice [:pos]."
  - "Replace version[1:] with version[:version.find('.')]."
tags:
  - strings
  - slicing
  - split
