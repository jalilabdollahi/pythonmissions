title: "Create the Log Directory"
category: "Modules"
difficulty: 1
xp: 100
story: |
  The log setup creates the log directory. It crashes if parent directories
  don't exist because parents=True is missing.
description: |
  ensure_log_dir(path) creates path and all parent directories.
  Bug: mkdir() called without parents=True.
hints:
  - "Path.mkdir() fails if parent dirs don't exist."
  - "Pass parents=True to create all intermediate directories."
  - "Change .mkdir() to .mkdir(parents=True, exist_ok=True)."
tags:
  - modules
  - pathlib
  - mkdir
