title: "Validate Port in Dataclass"
category: "OOP"
difficulty: 1
xp: 100
story: |
  The Service dataclass validates port range after creation.
  __post_init__ is misspelled — validation never runs.
description: |
  Service.__post_init__ validates port is in 1-65535 range.
  Bug: method is named __post_init__ but spelled wrong.
hints:
  - "The post-init hook method must be named exactly __post_init__."
  - "Check for typos in the method name."
  - "Rename __post_init_check__ to __post_init__."
tags:
  - oop
  - dataclasses
  - validation
