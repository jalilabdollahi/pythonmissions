title: "Calculate Uptime Hours"
category: "Modules"
difficulty: 1
xp: 100
story: |
  The uptime calculator finds how many hours a server has been running.
  It's returning seconds instead of hours.
description: |
  uptime_hours(start, end) returns float hours between two datetimes.
  Bug: returns total_seconds() instead of dividing by 3600.
hints:
  - "timedelta.total_seconds() returns seconds."
  - "Divide by 3600 to convert seconds to hours."
  - "Change .total_seconds() to .total_seconds() / 3600."
tags:
  - modules
  - datetime
  - timedelta
