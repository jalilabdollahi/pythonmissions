title: "Reverse the Hostname"
category: "Strings"
difficulty: 1
xp: 100
story: |
  The DNS tool reverses a hostname for reverse-lookup formatting.
  It should return 'ten.lanretni.bew' for 'web.internal.net'
  but returns an empty string.
description: |
  reverse_host(s) returns the string reversed.
  Bug: slice step is 1 (forward) instead of -1 (backward).
hints:
  - "String slicing: s[::1] is forward, s[::-1] is reversed."
  - "To reverse a string, use s[::-1]."
  - "Change s[::1] to s[::-1]."
tags:
  - strings
  - slicing
  - reverse
