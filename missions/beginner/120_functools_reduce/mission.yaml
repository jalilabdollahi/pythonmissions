title: "Multiply All Replicas"
category: "Modules"
difficulty: 1
xp: 100
story: |
  The capacity calculator multiplies all replica counts together.
  reduce is called but the import is from wrong module.
description: |
  total_capacity(replicas) returns product of all values using reduce.
  Bug: reduce is imported from builtins (doesn't exist); import from functools.
hints:
  - "reduce() was removed from builtins in Python 3."
  - "Import it from functools: from functools import reduce."
  - "Change 'from builtins import reduce' to 'from functools import reduce'."
tags:
  - modules
  - functools
  - reduce
