title: "Split Tags to List"
category: "Type Conversion"
difficulty: 1
xp: 100
story: |
  Tags are stored as comma-separated strings. The converter should
  return a list but returns a list of characters instead.
description: |
  tags_to_list(s) splits comma-separated string into list of tags.
  Bug: list(s) iterates characters; use s.split(',').
hints:
  - "list('a,b,c') produces ['a', ',', 'b', ',', 'c'] — each character."
  - "s.split(',') splits by comma: ['a', 'b', 'c']."
  - "Change list(s) to [t.strip() for t in s.split(',')]."
tags:
  - type-conversion
  - split
  - lists
