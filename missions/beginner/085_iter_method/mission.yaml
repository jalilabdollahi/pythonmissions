title: "Iterate the Server Pool"
category: "OOP"
difficulty: 1
xp: 100
story: |
  The ServerPool should be iterable so callers can use it in for loops.
  Currently 'for host in pool' raises TypeError.
description: |
  ServerPool.__iter__ returns an iterator over _hosts.
  Bug: __iter__ method is missing.
hints:
  - "For loops call __iter__() on the object."
  - "Add def __iter__(self): return iter(self._hosts)."
  - "iter(self._hosts) returns a list iterator."
tags:
  - oop
  - __iter__
  - iteration
