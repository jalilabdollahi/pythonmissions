title: "Center the Banner Text"
category: "Strings"
difficulty: 1
xp: 100
story: |
  The deploy banner centers text in a 60-char wide box.
  The width argument is missing — defaults to 0, no centering happens.
description: |
  center_text(text, width) returns text centered in width characters.
  Bug: center() is called with no width argument.
hints:
  - "str.center(width) centers the string in a field of 'width' chars."
  - "Without width, center() requires an argument."
  - "Change text.center() to text.center(width)."
tags:
  - strings
  - center
  - formatting
