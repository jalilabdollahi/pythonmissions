title: "Raise a Custom Error"
category: "Error Handling"
difficulty: 1
xp: 100
story: |
  Port validation raises a plain Exception. The team wants a
  ValueError so callers can catch it specifically. Fix the raise.
description: |
  validate_port(port) raises ValueError if port is out of range.
  Bug: raises Exception instead of ValueError.
hints:
  - "Use ValueError for invalid value inputs."
  - "Change raise Exception(...) to raise ValueError(...)."
  - "ValueError is a built-in that signals an invalid argument value."
tags:
  - error-handling
  - exceptions
  - ValueError
