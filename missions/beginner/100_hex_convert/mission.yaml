title: "Convert the Color Code"
category: "Modules"
difficulty: 1
xp: 100
story: |
  The dashboard converts hex color codes to integers for CSS calculations.
  int(hex_str, 16) is called but the hex string still has the '#' prefix.
description: |
  hex_to_int(hex_str) converts a hex color string like '#FF5733' to int.
  Bug: '#' prefix is not stripped before conversion.
hints:
  - "int('#FF5733', 16) raises ValueError — the '#' must be removed first."
  - "Strip the '#' with hex_str.lstrip('#') or hex_str[1:]."
  - "Change int(hex_str, 16) to int(hex_str.lstrip('#'), 16)."
tags:
  - modules
  - hex
  - type-conversion
