title: "Convert Ports to Integers"
category: "Comprehensions"
difficulty: 1
xp: 100
story: |
  The port normalizer converts a list of string ports to integers.
  It wraps map() in list() wrong — the outer list() is missing.
description: |
  int_ports(port_strings) returns list of integer ports.
  Bug: returns a map object instead of a list.
hints:
  - "map(func, iterable) returns a lazy map object, not a list."
  - "Wrap with list() to get a list: list(map(int, port_strings))."
  - "Change return map(int, port_strings) to return list(map(int, port_strings))."
tags:
  - comprehensions
  - map
  - type-conversion
