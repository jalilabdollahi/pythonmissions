title: "Check All Services Up"
category: "Comprehensions"
difficulty: 1
xp: 100
story: |
  The SLA checker verifies all services are up. It uses any() but
  should use all() — passing when only one service is healthy.
description: |
  all_healthy(services) returns True only if all services are 'up'.
  Bug: any() returns True if at least one is up; need all().
hints:
  - "any(iterable) is True if at least one element is truthy."
  - "all(iterable) is True only if every element is truthy."
  - "Change any(...) to all(...)."
tags:
  - comprehensions
  - any
  - all
