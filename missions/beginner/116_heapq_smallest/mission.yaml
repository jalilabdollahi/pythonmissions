title: "Find the Three Slowest Endpoints"
category: "Modules"
difficulty: 1
xp: 100
story: |
  The SRE tool finds the 3 slowest API response times from a large list.
  It uses nlargest instead of nsmallest — reports fastest, not slowest.
description: |
  slowest_three(times) returns the 3 largest response times.
  Bug: nsmallest returns smallest; need nlargest for slowest.
hints:
  - "heapq.nsmallest(n, iterable) returns the n smallest values."
  - "heapq.nlargest(n, iterable) returns the n largest values."
  - "Change heapq.nsmallest(3, times) to heapq.nlargest(3, times)."
tags:
  - modules
  - heapq
  - performance
