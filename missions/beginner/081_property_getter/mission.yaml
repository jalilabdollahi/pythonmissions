title: "Expose the Endpoint URL"
category: "OOP"
difficulty: 1
xp: 100
story: |
  The Service class should expose a read-only endpoint property.
  The @property decorator is missing so endpoint is a plain method call.
description: |
  Service.endpoint is a @property returning 'host:port'.
  Bug: @property decorator is missing above the method definition.
hints:
  - "Without @property, svc.endpoint returns the method object, not the value."
  - "Add @property above def endpoint(self): to make it a property."
  - "Insert @property on the line before def endpoint(self):."
tags:
  - oop
  - property
  - decorators
