title: "Sort the Hosts"
category: "Lists"
difficulty: 1
xp: 100
story: |
  The dashboard sorts server names alphabetically before display.
  It's printing None instead of the sorted list. Fix it.
description: |
  sorted_hosts(hosts) returns the list sorted alphabetically.
  Bug: list.sort() sorts in-place and returns None. Use sorted() instead.
hints:
  - "list.sort() modifies in place and returns None."
  - "sorted(list) returns a new sorted list."
  - "Change hosts.sort() to return sorted(hosts)."
tags:
  - lists
  - sort
  - sorted
