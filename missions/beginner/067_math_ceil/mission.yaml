title: "Round Up the Replica Count"
category: "Modules"
difficulty: 1
xp: 100
story: |
  The autoscaler calculates how many replicas are needed by dividing
  load by capacity. It uses floor instead of ceil — we need more replicas.
description: |
  replica_count(load, capacity) returns ceil(load/capacity).
  Bug: math.floor() rounds down; should use math.ceil().
hints:
  - "math.floor() rounds down. math.ceil() rounds up."
  - "For safety we need at least enough replicas, so always round up."
  - "Change math.floor to math.ceil."
tags:
  - modules
  - math
  - rounding
