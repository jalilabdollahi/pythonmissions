title: "Flush the Progress Output"
category: "Modules"
difficulty: 1
xp: 100
story: |
  The progress printer should flush stdout immediately so the user
  sees progress. The flush=True argument is missing.
description: |
  print_progress(step, total) prints progress and flushes stdout.
  Bug: flush=True is missing from print() call.
hints:
  - "print() buffers output by default."
  - "print(..., flush=True) forces immediate output."
  - "Add flush=True to the print() call."
tags:
  - modules
  - print
  - stdout
