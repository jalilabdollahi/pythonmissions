title: "Build the Status Map"
category: "Comprehensions"
difficulty: 1
xp: 100
story: |
  The status reporter maps server names to their status codes.
  The dict comprehension has key and value the wrong way around.
description: |
  status_map(servers) returns {name: status} dict.
  Bug: key and value are swapped in the dict comprehension.
hints:
  - "Dict comprehension: {key: value for item in iterable}."
  - "Check which side of ':' is the name and which is the status."
  - "Swap s['status'] and s['name'] in the comprehension."
tags:
  - comprehensions
  - dict-comprehension
