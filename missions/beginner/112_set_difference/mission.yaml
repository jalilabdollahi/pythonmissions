title: "Find New Alerts"
category: "Modules"
difficulty: 1
xp: 100
story: |
  The alert deduplicator finds new alerts not seen in the previous batch.
  It uses symmetric_difference which also returns resolved alerts.
description: |
  new_alerts(previous, current) returns alerts in current but not previous.
  Bug: symmetric_difference returns items in either but not both.
hints:
  - "set.symmetric_difference() = items in one set but not the other."
  - "set.difference() = items in the first set but not the second."
  - "Change .symmetric_difference(current) to current.difference(previous)."
tags:
  - modules
  - set
  - difference
