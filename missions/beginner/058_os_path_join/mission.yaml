title: "Join Config Path"
category: "File I/O"
difficulty: 1
xp: 100
story: |
  The config loader builds file paths using string concatenation.
  On Windows the path separator breaks everything. Use os.path.join.
description: |
  config_path(base_dir, filename) returns the joined path safely.
  Bug: uses string + '/' + string instead of os.path.join.
hints:
  - "os.path.join handles OS-specific path separators automatically."
  - "String concatenation like base + '/' + name breaks on Windows."
  - "Change base_dir + '/' + filename to os.path.join(base_dir, filename)."
tags:
  - file-io
  - os.path
  - paths
