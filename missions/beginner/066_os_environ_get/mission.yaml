title: "Read the DB Password"
category: "Modules"
difficulty: 1
xp: 100
story: |
  The DB connector reads the password from an env variable.
  It crashes when the variable is not set. Use get() with a default.
description: |
  get_db_password() returns DB_PASSWORD env var or 'changeme' default.
  Bug: os.environ['DB_PASSWORD'] raises KeyError if not set.
hints:
  - "os.environ['KEY'] raises KeyError if KEY is missing."
  - "os.environ.get('KEY', 'default') returns the default safely."
  - "Change os.environ['DB_PASSWORD'] to os.environ.get('DB_PASSWORD', 'changeme')."
tags:
  - modules
  - os
  - environment-variables
