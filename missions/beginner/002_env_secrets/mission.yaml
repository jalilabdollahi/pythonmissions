title: "Env Secrets"
category: "os.environ"
difficulty: 1
xp: 100
story: |
  The app reads database credentials from environment variables.
  Never hardcode secrets in code - that's rule #1.
  The script is broken and the app can't connect to the database.
  Fix it.
description: |
  The script should read DB_HOST, DB_PORT, and DB_NAME from
  environment variables and return them as a dict.

  There are 2 bugs:
    1. `os.env` does not exist - the correct attribute is `os.environ`
    2. DB_PORT should be returned as an integer, not a string.
       Use int() to convert it, with a default of 5432.
hints:
  - "There is no `os.env`. The correct attribute is `os.environ`."
  - "os.environ.get('DB_PORT', '5432') returns a string. Wrap it with int()."
  - "Fix: os.environ.get('DB_HOST', 'localhost') and int(os.environ.get('DB_PORT', '5432'))"
tags:
  - os.environ
  - environment-variables
  - types
  - secrets
