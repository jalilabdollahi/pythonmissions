title: "Flatten the Nested Host Lists"
category: "Comprehensions"
difficulty: 1
xp: 100
story: |
  Region groups contain lists of hosts. The flattener should produce
  one flat list but nests the inner lists instead.
description: |
  flatten(groups) returns a single flat list of all hosts.
  Bug: the comprehension iterates groups not inner lists.
hints:
  - "A nested list comprehension: [x for group in groups for x in group]."
  - "The outer for iterates groups; the inner for iterates items in each group."
  - "Change [g for g in groups] to [h for g in groups for h in g]."
tags:
  - comprehensions
  - nested
  - flatten
