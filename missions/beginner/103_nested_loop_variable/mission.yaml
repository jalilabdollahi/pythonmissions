title: "Build the Config Matrix"
category: "Loops"
difficulty: 1
xp: 100
story: |
  The config generator creates all (env, service) combinations.
  Both loops use the same variable 'i' — inner shadows outer.
description: |
  config_pairs(envs, services) returns all (env, service) tuples.
  Bug: inner loop uses 'i' for services, shadowing 'i' for envs.
hints:
  - "Using the same variable name in nested loops causes the outer to lose its value."
  - "Rename the inner loop variable from 'i' to 'j' or 'svc'."
  - "Change 'for i in services' to 'for svc in services' and use 'svc' in the body."
tags:
  - loops
  - nested
  - variable-naming
