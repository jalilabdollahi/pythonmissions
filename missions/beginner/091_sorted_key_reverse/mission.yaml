title: "Sort Servers by CPU Descending"
category: "Comprehensions"
difficulty: 1
xp: 100
story: |
  The resource monitor lists servers with highest CPU first.
  The sort is ascending instead of descending.
description: |
  top_cpu(servers) returns servers sorted by cpu_pct descending.
  Bug: reverse=False (default) sorts ascending.
hints:
  - "sorted(iterable, key=..., reverse=False) is ascending by default."
  - "Set reverse=True to sort in descending order."
  - "Add reverse=True to the sorted() call."
tags:
  - comprehensions
  - sorted
  - reverse
