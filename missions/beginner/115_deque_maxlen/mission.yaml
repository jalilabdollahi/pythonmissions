title: "Rolling Log Window"
category: "Modules"
difficulty: 1
xp: 100
story: |
  The live log viewer keeps only the last 100 lines. The deque is
  created without maxlen — it grows without bound.
description: |
  LogWindow.add(line) appends to a maxlen=100 deque.
  Bug: deque() has no maxlen — all lines accumulate.
hints:
  - "collections.deque(maxlen=N) automatically discards old items when full."
  - "deque() without maxlen grows forever."
  - "Change deque() to deque(maxlen=100)."
tags:
  - modules
  - collections
  - deque
