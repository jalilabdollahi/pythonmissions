title: "Pretty-Print the Config"
category: "Modules"
difficulty: 1
xp: 100
story: |
  The config exporter should output indented JSON. It outputs one
  long line because the indent argument is missing.
description: |
  pretty_json(data) returns JSON string with 2-space indentation.
  Bug: json.dumps(data) has no indent argument.
hints:
  - "json.dumps(data, indent=2) adds indentation."
  - "Without indent, json.dumps produces a single-line output."
  - "Add indent=2 to the json.dumps() call."
tags:
  - modules
  - json
  - formatting
