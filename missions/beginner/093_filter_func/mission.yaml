title: "Remove Stopped Containers"
category: "Comprehensions"
difficulty: 1
xp: 100
story: |
  The container manager filters out stopped containers.
  filter() returns an iterator — needs list() to materialize it.
description: |
  running_containers(containers) returns list of non-stopped containers.
  Bug: returns filter object instead of list.
hints:
  - "filter(func, iterable) returns a lazy iterator."
  - "Wrap with list() to get a list: list(filter(...))."
  - "Change return filter(...) to return list(filter(...))."
tags:
  - comprehensions
  - filter
  - lists
