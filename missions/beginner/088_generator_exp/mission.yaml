title: "Generate Metric Lines"
category: "Comprehensions"
difficulty: 1
xp: 100
story: |
  The metric exporter builds lines lazily using a generator expression.
  It's materializing all values into memory with a list comprehension.
description: |
  metric_lines(metrics) is a generator that yields 'key=value' strings.
  Bug: returns a list comprehension instead of a generator expression.
hints:
  - "[expr for x in it] builds a full list in memory."
  - "(expr for x in it) is a generator — lazy, memory-efficient."
  - "Change [...] to (...) or use yield in a def."
tags:
  - comprehensions
  - generators
  - memory
