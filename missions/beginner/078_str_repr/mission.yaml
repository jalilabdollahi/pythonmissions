title: "Display the Alert"
category: "OOP"
difficulty: 1
xp: 100
story: |
  The Alert class should display nicely when printed. But print(alert)
  shows the raw object address instead of the alert message.
description: |
  Alert.__str__ returns a human-readable string.
  Bug: the method is named __repr__ instead of __str__.
hints:
  - "__str__ is called by print() and str()."
  - "__repr__ is for debugging and repr()."
  - "Rename __repr__ to __str__ (or add __str__ alongside)."
tags:
  - oop
  - __str__
  - __repr__
