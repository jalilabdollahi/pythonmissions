title: "Don't Share the Server List"
category: "Functions"
difficulty: 1
xp: 100
story: |
  Each call to create a new deployment should start with an empty
  server list. But all deployments are sharing the same list. Fix it.
description: |
  new_deployment(name, servers=[]) should use a fresh list each call.
  Bug: mutable default argument is shared across all calls.
hints:
  - "Never use mutable objects (lists, dicts) as default argument values."
  - "Default arguments are evaluated once when the function is defined."
  - "Change servers=[] to servers=None, then: if servers is None: servers = []"
tags:
  - functions
  - mutable-default
  - gotchas
