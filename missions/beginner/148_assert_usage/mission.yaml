title: "Assert the Response Status"
category: "Error Handling"
difficulty: 1
xp: 100
story: |
  The test helper asserts that an HTTP response is successful.
  The assert condition checks the wrong comparison.
description: |
  assert_success(status_code) raises AssertionError if code >= 400.
  Bug: asserts code >= 400 (passes for error codes).
hints:
  - "assert condition raises AssertionError when condition is False."
  - "To assert success, condition should be True for 2xx/3xx codes."
  - "Change assert status_code >= 400 to assert status_code < 400."
tags:
  - error-handling
  - assert
  - testing
