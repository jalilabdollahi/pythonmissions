title: "Validate Port Input"
category: "Strings"
difficulty: 1
xp: 100
story: |
  The CLI validator checks if the port input is all digits before converting.
  It uses isalpha() which checks for letters, not digits.
description: |
  is_valid_port_str(s) returns True if s consists of digits only.
  Bug: isalpha() checks for alphabetic chars; should use isdigit().
hints:
  - "str.isalpha() returns True for alphabetic strings like 'abc'."
  - "str.isdigit() returns True for digit strings like '8080'."
  - "Change s.isalpha() to s.isdigit()."
tags:
  - strings
  - isdigit
  - validation
