title: "Pop with a Safety Net"
category: "Dicts"
difficulty: 1
xp: 100
story: |
  The feature-flag system removes a flag by name, returning its value.
  If the flag doesn't exist it should return False, not crash.
description: |
  remove_flag(flags, name) removes and returns flags[name] or False.
  Bug: pop() called without default raises KeyError when key missing.
hints:
  - "dict.pop(key) raises KeyError if key is missing."
  - "dict.pop(key, default) returns default if key is missing."
  - "Change flags.pop(name) to flags.pop(name, False)."
tags:
  - dicts
  - pop
  - default
