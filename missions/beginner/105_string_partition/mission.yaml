title: "Split Host from Port"
category: "Strings"
difficulty: 1
xp: 100
story: |
  The URL parser splits 'host:port' on the colon using split(':')[0].
  But IPv6 addresses have multiple colons — partition is safer.
description: |
  split_host_port(endpoint) returns (host, port) tuple.
  Bug: split(':') on IPv6 gives too many parts; use partition(':').
hints:
  - "'a:b:c'.split(':') gives ['a','b','c'] — bad for IPv6."
  - "str.partition(':') always returns (before, sep, after) — exactly 3 parts."
  - "Change split(':') to partition(':') and unpack host, _, port."
tags:
  - strings
  - partition
  - split
