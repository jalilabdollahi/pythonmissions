title: "Compare Service States"
category: "OOP"
difficulty: 2
xp: 150
story: |
  The ServiceState enum compares states. Using 'is' for enum comparison
  works but the values aren't correct — comparing wrong member.
description: |
  ServiceState enum with RUNNING, STOPPED, DEGRADED values.
  Bug: is_running checks for STOPPED state instead of RUNNING.
hints:
  - "Enum comparison: state == ServiceState.RUNNING or state is ServiceState.RUNNING."
  - "is_running should check for RUNNING, not STOPPED."
  - "Change ServiceState.STOPPED to ServiceState.RUNNING in is_running."
tags:
  - oop
  - enum
  - comparison
