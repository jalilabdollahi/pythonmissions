title: "Format the Alert Message"
category: "Strings"
difficulty: 1
xp: 100
story: |
  The alert formatter uses .format() with named placeholders. The key
  name in the format string doesn't match the kwarg name.
description: |
  format_alert(level, msg) returns formatted alert string.
  Bug: placeholder {message} doesn't match kwarg msg=...
hints:
  - "str.format() matches placeholder names to keyword argument names."
  - "{message} requires a kwarg named 'message=...', not 'msg=...'."
  - "Change {message} to {msg} in the format string, or change kwarg to message=msg."
tags:
  - strings
  - format
  - formatting
