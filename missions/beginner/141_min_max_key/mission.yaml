title: "Find Heaviest and Lightest Pod"
category: "Modules"
difficulty: 1
xp: 100
story: |
  The scheduler finds the pod with highest and lowest memory usage.
  The key function returns the wrong field.
description: |
  heaviest(pods) and lightest(pods) return pod with max/min memory_mb.
  Bug: key lambda returns pod['cpu'] instead of pod['memory_mb'].
hints:
  - "max(iterable, key=func) returns the item where func(item) is highest."
  - "The key should return pod['memory_mb'], not pod['cpu']."
  - "Change lambda p: p['cpu'] to lambda p: p['memory_mb']."
tags:
  - modules
  - max
  - min
