title: "Count the Events"
category: "Dicts"
difficulty: 1
xp: 100
story: |
  The log aggregator counts occurrences of each event type.
  It crashes with KeyError the first time a new event type appears.
description: |
  count_event(counts, event) increments counts[event] or initializes to 1.
  Bug: counts[event] += 1 crashes if event not yet in dict. Use setdefault.
hints:
  - "setdefault(key, 0) initializes the key to 0 if it doesn't exist."
  - "counts.setdefault(event, 0) then counts[event] += 1 is safe."
  - "Add counts.setdefault(event, 0) before the += 1 line."
tags:
  - dicts
  - setdefault
  - counters
