title: "Check if Host in Pool"
category: "OOP"
difficulty: 1
xp: 100
story: |
  The ServerPool should support 'in' operator to check membership.
  Currently 'host in pool' always raises TypeError.
description: |
  ServerPool.__contains__(self, host) returns True if host is in _hosts.
  Bug: __contains__ method is missing.
hints:
  - "'x in obj' calls obj.__contains__(x)."
  - "Add def __contains__(self, item): return item in self._hosts."
  - "Without __contains__, 'in' raises TypeError for custom classes."
tags:
  - oop
  - __contains__
  - dunder
