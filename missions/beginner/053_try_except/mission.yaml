title: "Handle the Missing File"
category: "Error Handling"
difficulty: 1
xp: 100
story: |
  The config loader crashes with FileNotFoundError if the config file
  is missing. It should return an empty dict instead. Fix it.
description: |
  load_config(path) returns config dict or {} if file not found.
  Bug: no try/except — FileNotFoundError propagates to caller.
hints:
  - "Wrap the open() call in a try/except FileNotFoundError block."
  - "In the except block, return {}."
  - "Add try: ... except FileNotFoundError: return {}"
tags:
  - error-handling
  - try-except
  - files
