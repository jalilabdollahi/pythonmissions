title: "Generate Config Lines"
category: "OOP"
difficulty: 1
xp: 100
story: |
  The config streamer should lazily yield config lines one at a time.
  It returns all at once with a list comprehension — memory-intensive.
description: |
  config_stream(cfg) is a generator that yields 'key=value' lines.
  Bug: uses return with a list instead of yield.
hints:
  - "Generators use 'yield' to produce values one at a time."
  - "Using 'return [...]' makes a regular function returning a list."
  - "Replace the return and list with individual 'yield' statements or 'yield from'."
tags:
  - oop
  - generators
  - yield
