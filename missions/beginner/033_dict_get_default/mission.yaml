title: "Get Config with Default"
category: "Dicts"
difficulty: 1
xp: 100
story: |
  The config loader tries to read a key that might not exist.
  It crashes with KeyError instead of returning the default. Fix it.
description: |
  get_config(cfg, key, default) returns cfg[key] or default if missing.
  Bug: direct bracket access raises KeyError. Use dict.get().
hints:
  - "cfg[key] raises KeyError if key is missing."
  - "cfg.get(key, default) returns default if key is not in cfg."
  - "Change cfg[key] to cfg.get(key, default)."
tags:
  - dicts
  - get
  - KeyError
