title: "Extract Config Name"
category: "Modules"
difficulty: 1
xp: 100
story: |
  The config manager extracts the base name without extension from a path.
  It returns the full filename instead of just the stem.
description: |
  get_config_name(path) returns the stem (filename without extension).
  Bug: returns path.name (full filename) instead of path.stem.
hints:
  - "Path.name returns 'config.yaml'. Path.stem returns 'config'."
  - "Use .stem instead of .name to strip the extension."
  - "Change path.name to path.stem."
tags:
  - modules
  - pathlib
  - stem
