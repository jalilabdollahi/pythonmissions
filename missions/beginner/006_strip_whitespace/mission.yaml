title: "Strip the Noise"
category: "Strings"
difficulty: 1
xp: 100
story: |
  The monitoring team copy-pastes server names from a wiki page.
  Every name comes with trailing spaces and newlines. Your trim
  function is only removing the left side. Fix it.
description: |
  clean_name(s) should remove ALL leading AND trailing whitespace.
  Bug: lstrip() only strips the left side.
hints:
  - "lstrip removes only left whitespace. You need strip()."
  - "str.strip() removes both ends. str.lstrip() only the left."
  - "Change lstrip() to strip()."
tags:
  - strings
  - strip
  - whitespace
