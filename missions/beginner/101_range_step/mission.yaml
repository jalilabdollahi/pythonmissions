title: "Generate Even Port Numbers"
category: "Loops"
difficulty: 1
xp: 100
story: |
  The port scanner should test even-numbered ports from 8000 to 8100.
  The range step is 1 — it tests every port instead of every other one.
description: |
  even_ports(start, stop) returns list of even ports using range step=2.
  Bug: range(start, stop, 1) — step should be 2.
hints:
  - "range(start, stop, step) generates numbers with given step."
  - "step=1 gives every number. step=2 skips every other."
  - "Change range(start, stop, 1) to range(start, stop, 2)."
tags:
  - loops
  - range
  - step
