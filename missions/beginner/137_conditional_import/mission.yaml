title: "Import the Right JSON Library"
category: "Modules"
difficulty: 1
xp: 100
story: |
  The script tries to import the faster ujson, falling back to stdlib json.
  The except clause catches the wrong exception type.
description: |
  try_import_json() returns ujson if available, else json module.
  Bug: catches ValueError instead of ImportError.
hints:
  - "ImportError is raised when a module is not installed."
  - "ValueError is for invalid values, not missing modules."
  - "Change except ValueError to except ImportError."
tags:
  - modules
  - import
  - error-handling
