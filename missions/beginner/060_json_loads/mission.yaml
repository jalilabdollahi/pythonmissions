title: "Parse the JSON Response"
category: "Type Conversion"
difficulty: 1
xp: 100
story: |
  The API client receives a JSON string and parses it. It's calling
  json.load() which expects a file, not a string. Fix it.
description: |
  parse_response(text) parses a JSON string and returns the dict.
  Bug: json.load() takes a file object; json.loads() takes a string.
hints:
  - "json.load(f) reads from a file object."
  - "json.loads(s) parses a JSON string — the 's' stands for 'string'."
  - "Change json.load(text) to json.loads(text)."
tags:
  - type-conversion
  - json
  - loads
