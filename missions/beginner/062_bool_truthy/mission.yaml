title: "Check if Service is Enabled"
category: "Type Conversion"
difficulty: 1
xp: 100
story: |
  Feature flags come from env vars as 'true'/'false' strings.
  The checker treats both as True because non-empty strings are truthy.
description: |
  is_enabled(val) returns True only if val is 'true' (case-insensitive).
  Bug: bool(val) on a non-empty string is always True.
hints:
  - "bool('false') is True because 'false' is a non-empty string."
  - "Compare val.lower() == 'true' for correct string-to-bool conversion."
  - "Change bool(val) to val.lower() == 'true'."
tags:
  - type-conversion
  - bool
  - truthiness
