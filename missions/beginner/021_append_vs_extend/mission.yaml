title: "Extend the Server List"
category: "Lists"
difficulty: 1
xp: 100
story: |
  The auto-scaler combines two server lists. Instead of getting a flat
  list, the team is getting a list with a nested list inside. Fix it.
description: |
  merge_servers(base, new_servers) extends base with items from new_servers.
  Bug: append() adds the whole list as one element. Use extend().
hints:
  - "list.append(x) adds x as a single element (even if x is a list)."
  - "list.extend(iterable) adds each item from iterable individually."
  - "Change .append(new_servers) to .extend(new_servers)."
tags:
  - lists
  - append
  - extend
