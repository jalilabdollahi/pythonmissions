title: "Repeat the Separator"
category: "Strings"
difficulty: 1
xp: 100
story: |
  Log headers use a repeated dash separator. The builder should
  return 40 dashes but is returning the number 40 instead.
description: |
  make_separator(n) returns a string of n dashes.
  Bug: '-' * n is integer multiplication — need string multiplication.
hints:
  - "'-' * 40 is valid Python and returns a string of 40 dashes."
  - "Check that '-' is a string (in quotes), not an integer."
  - "The expression is correct. Ensure the '-' character is quoted."
tags:
  - strings
  - multiplication
  - types
