title: "Build the Port Map"
category: "Dicts"
difficulty: 1
xp: 100
story: |
  The service registry builds a name->port mapping from two lists.
  It's returning a set of tuples instead of a dict. Fix it.
description: |
  build_port_map(names, ports) returns {name: port} dict.
  Bug: {(name, port) for ...} creates a set of tuples, not a dict comprehension.
hints:
  - "A set comprehension uses {expr for ...}."
  - "A dict comprehension uses {key: value for ...}."
  - "Change {(name, port) for ...} to {name: port for ...}."
tags:
  - dicts
  - dict-comprehension
  - zip
