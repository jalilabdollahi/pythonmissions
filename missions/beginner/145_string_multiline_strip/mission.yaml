title: "Strip Multiline Config Block"
category: "Strings"
difficulty: 1
xp: 100
story: |
  The config parser reads a HEREDOC-style block and strips leading/trailing
  whitespace from each line. strip() is called on the whole string, not each line.
description: |
  clean_block(text) returns list of stripped non-empty lines.
  Bug: strips the whole string, then returns it as one string instead of lines.
hints:
  - "text.strip() strips the whole string, not individual lines."
  - "Split first: text.splitlines(), then strip each line."
  - "Return [line.strip() for line in text.splitlines() if line.strip()]."
tags:
  - strings
  - strip
  - multiline
