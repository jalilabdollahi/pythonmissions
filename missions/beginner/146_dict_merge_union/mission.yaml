title: "Merge Configs with Union Operator"
category: "Dicts"
difficulty: 2
xp: 150
story: |
  Python 3.9+ has the | operator for merging dicts. The code uses |=
  which modifies the left dict in place — should return a new dict.
description: |
  merge(base, override) returns a new merged dict without modifying inputs.
  Bug: base |= override modifies base in place.
hints:
  - "d1 | d2 creates a new merged dict (non-destructive)."
  - "d1 |= d2 updates d1 in place (destructive)."
  - "Change base |= override to return base | override."
tags:
  - dicts
  - merge
  - python39
