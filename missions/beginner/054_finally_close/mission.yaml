title: "Always Close the Connection"
category: "Error Handling"
difficulty: 1
xp: 100
story: |
  The DB wrapper opens a connection and must close it even on error.
  The close() is inside the try block — if an error occurs it's skipped.
description: |
  run_query(conn, sql) runs sql and always closes conn.
  Bug: conn.close() is inside try; it should be in finally.
hints:
  - "finally always runs, even if an exception is raised."
  - "Move conn.close() from the try block into a finally block."
  - "Add 'finally: conn.close()' after the except block."
tags:
  - error-handling
  - finally
  - resources
