title: "Top N Error Codes"
category: "Modules"
difficulty: 1
xp: 100
story: |
  The error reporter finds the most common HTTP error codes.
  It returns a dict instead of the top-N list of (code, count) pairs.
description: |
  top_errors(codes, n) returns n most common error codes as list of tuples.
  Bug: returns the Counter dict instead of calling .most_common(n).
hints:
  - "Counter(iterable) creates a frequency dict."
  - "Counter.most_common(n) returns top n (item, count) pairs as a list."
  - "Add .most_common(n) to the Counter() call."
tags:
  - modules
  - collections
  - Counter
