title: "Sort Config by Key"
category: "Modules"
difficulty: 1
xp: 100
story: |
  The config viewer should display settings sorted alphabetically by key.
  It sorts by value instead of by key.
description: |
  sorted_config(cfg) returns list of (key, value) tuples sorted by key.
  Bug: sorted key lambda returns v (value) instead of k (key).
hints:
  - "sorted(d.items(), key=lambda kv: kv[1]) sorts by value."
  - "sorted(d.items(), key=lambda kv: kv[0]) sorts by key."
  - "Change kv[1] to kv[0] in the lambda."
tags:
  - modules
  - sorted
  - dicts
