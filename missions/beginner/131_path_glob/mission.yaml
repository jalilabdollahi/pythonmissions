title: "Find All YAML Configs"
category: "Modules"
difficulty: 1
xp: 100
story: |
  The config loader finds all .yaml files in a directory. pathlib glob
  pattern is wrong — matches nothing.
description: |
  find_yaml_files(directory) returns list of .yaml file paths.
  Bug: glob pattern '*.yml' misses '.yaml' extension files.
hints:
  - "Glob pattern '*.yml' only matches files ending in .yml."
  - "Use '*.yaml' or a combined pattern."
  - "Change '*.yml' to '*.yaml'."
tags:
  - modules
  - pathlib
  - glob
