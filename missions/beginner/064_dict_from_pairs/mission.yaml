title: "Build Dict from Key=Value Lines"
category: "Type Conversion"
difficulty: 1
xp: 100
story: |
  Config files have lines like 'host=localhost'. The parser should
  build a dict but returns a list of tuples instead.
description: |
  parse_kv_lines(lines) returns a dict from 'key=value' strings.
  Bug: returns list of tuples instead of calling dict() on them.
hints:
  - "dict([(k,v), ...]) converts a list of pairs to a dict."
  - "Wrap the list comprehension in dict()."
  - "Change return [...] to return dict([...])."
tags:
  - type-conversion
  - dict
  - parsing
