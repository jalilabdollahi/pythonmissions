title: "Hash the Config File"
category: "Modules"
difficulty: 1
xp: 100
story: |
  The integrity checker hashes a config file for change detection.
  hashlib.md5() is called without encoding the string first.
description: |
  hash_content(text) returns MD5 hex digest of text.
  Bug: text must be encoded to bytes before hashing.
hints:
  - "hashlib.md5() requires bytes, not a string."
  - "Encode first: text.encode('utf-8') or text.encode()."
  - "Change hashlib.md5(text) to hashlib.md5(text.encode())."
tags:
  - modules
  - hashlib
  - encoding
