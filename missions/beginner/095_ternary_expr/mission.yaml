title: "Classify the HTTP Code"
category: "Comprehensions"
difficulty: 1
xp: 100
story: |
  The response classifier should use a ternary expression to return
  'ok' or 'error' inline. The syntax is backwards.
description: |
  classify(code) returns 'ok' if code < 400 else 'error'.
  Bug: ternary expression has condition and values in wrong order.
hints:
  - "Python ternary: value_if_true if condition else value_if_false."
  - "The condition comes in the MIDDLE, not at the start."
  - "Change 'if code < 400 else "error" "ok"' to '"ok" if code < 400 else "error"'."
tags:
  - comprehensions
  - ternary
  - conditionals
