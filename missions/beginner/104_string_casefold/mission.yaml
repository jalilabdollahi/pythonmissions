title: "Case-Insensitive Username Check"
category: "Strings"
difficulty: 1
xp: 100
story: |
  The auth system checks usernames case-insensitively but lower() doesn't
  handle special Unicode characters properly. Use casefold() instead.
description: |
  normalize_user(name) returns casefold-normalized username.
  Bug: lower() is used instead of casefold() for proper unicode handling.
hints:
  - "str.lower() may not correctly handle some Unicode letters."
  - "str.casefold() is more aggressive and correct for case-insensitive comparison."
  - "Change .lower() to .casefold()."
tags:
  - strings
  - casefold
  - unicode
