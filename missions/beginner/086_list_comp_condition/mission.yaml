title: "Filter Healthy Servers"
category: "Comprehensions"
difficulty: 1
xp: 100
story: |
  The health filter keeps only servers where status=='healthy'.
  The condition is in the wrong part of the comprehension.
description: |
  healthy_servers(servers) returns list of names of healthy servers.
  Bug: condition placed after expression but before 'for' — syntax error.
hints:
  - "List comprehension: [expr for x in iterable if condition]."
  - "The 'if' clause comes at the END, after the 'for' clause."
  - "Move 'if s["status"]=="healthy"' to after the 'for s in servers' part."
tags:
  - comprehensions
  - list-comprehension
  - filtering
