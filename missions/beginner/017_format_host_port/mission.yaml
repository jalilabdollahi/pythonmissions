title: "Format Host and Port"
category: "Strings"
difficulty: 1
xp: 100
story: |
  The service registry formats host:port strings from separate values.
  The output looks like 'web-01:None' instead of 'web-01:8080'.
description: |
  format_endpoint(host, port) returns 'host:port' as a string.
  Bug: port variable is not included in the f-string — it uses None-placeholder.
hints:
  - "Check what variable is inside the curly braces for port."
  - "The f-string should reference the 'port' variable."
  - "Change {prot} or {None} to {port} in the f-string."
tags:
  - strings
  - f-strings
  - formatting
