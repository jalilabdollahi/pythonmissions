title: "Replace the Hostname"
category: "Strings"
difficulty: 1
xp: 100
story: |
  The deploy script updates config files by replacing the old hostname
  with a new one. It's not replacing anything. Users are still hitting
  the old server.
description: |
  swap_host(text, old, new) replaces occurrences of old with new.
  Bug: replace() arguments are swapped — new and old are in wrong order.
hints:
  - "str.replace(old, new) — first arg is what to find, second is what to put."
  - "Check the argument order: replace(old, new)."
  - "Swap the two arguments in the replace() call."
tags:
  - strings
  - replace
