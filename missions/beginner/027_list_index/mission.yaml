title: "Find the Node Index"
category: "Lists"
difficulty: 1
xp: 100
story: |
  The cluster manager finds a node's position in the node list.
  When the node doesn't exist, it crashes instead of returning -1.
description: |
  get_node_index(nodes, target) returns index of target or -1 if missing.
  Bug: list.index() raises ValueError when target not found.
hints:
  - "list.index(x) raises ValueError if x is not in the list."
  - "Check if target is in nodes before calling index()."
  - "Add 'if target in nodes' guard and return -1 in the else branch."
tags:
  - lists
  - index
  - error-handling
