title: "Build Config from Kwargs"
category: "Functions"
difficulty: 1
xp: 100
story: |
  The config builder should accept arbitrary keyword arguments and return
  them as a dict. It ignores all kwargs and always returns an empty dict.
description: |
  build_config(**kwargs) returns a dict of all provided keyword arguments.
  Bug: function ignores kwargs and returns {} instead of kwargs.
hints:
  - "**kwargs captures all keyword arguments as a dictionary."
  - "Return kwargs to expose all the captured key-value pairs."
  - "Change return {} to return kwargs."
tags:
  - functions
  - kwargs
