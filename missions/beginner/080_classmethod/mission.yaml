title: "Create Service from Dict"
category: "OOP"
difficulty: 1
xp: 100
story: |
  The Service factory method should create an instance from a dict.
  It's broken because it uses 'self' instead of 'cls' as the first parameter.
description: |
  Service.from_dict(cls, data) is a classmethod that creates a Service from a dict.
  Bug: decorated with @classmethod but uses 'self' — should use 'cls'.
hints:
  - "@classmethod receives the class as first argument, conventionally named 'cls'."
  - "With 'self', the method can't call self(...) to create an instance."
  - "Rename the first parameter from 'self' to 'cls'."
tags:
  - oop
  - classmethod
  - factories
