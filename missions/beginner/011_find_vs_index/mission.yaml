title: "Find the Service Port"
category: "Strings"
difficulty: 1
xp: 100
story: |
  A health checker scans config lines for the word 'port'.
  When 'port' is missing it should return -1, not raise an exception.
  Ops are seeing crashes instead of graceful -1 returns.
description: |
  find_port_offset(line) returns position of 'port' or -1 if missing.
  Bug: index() raises ValueError when 'port' is not found. Use find().
hints:
  - "str.index() raises ValueError if substring not found."
  - "str.find() returns -1 if substring not found — much safer here."
  - "Change .index('port') to .find('port')."
tags:
  - strings
  - find
  - index
