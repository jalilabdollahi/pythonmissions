title: "Enforce the Health Check Interface"
category: "OOP"
difficulty: 1
xp: 100
story: |
  The Monitor base class should make check() abstract so subclasses
  must implement it. Missing ABC inheritance means no enforcement.
description: |
  Monitor is an ABC with abstract check() method.
  Bug: does not inherit from ABC — abstractmethod has no effect.
hints:
  - "Without inheriting from ABC, @abstractmethod does nothing."
  - "Change class Monitor: to class Monitor(ABC):."
  - "Also import ABC: from abc import ABC, abstractmethod."
tags:
  - oop
  - abc
  - abstract
