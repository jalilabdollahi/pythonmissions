title: "Pick a Random Server"
category: "Modules"
difficulty: 1
xp: 100
story: |
  The load test randomly selects a server from the pool.
  It uses randint with wrong bounds. Use random.choice instead.
description: |
  pick_server(servers) returns a random server from the list.
  Bug: random.randint(0, len(servers)) can return an out-of-bounds index.
hints:
  - "random.randint(a, b) is inclusive on both ends — can return len(servers)."
  - "random.choice(seq) picks a random element safely."
  - "Replace random.randint usage with random.choice(servers)."
tags:
  - modules
  - random
  - lists
