title: "Hello, DevOps!"
category: "Variables"
difficulty: 1
xp: 100
story: |
  It's your first day on the job. The previous engineer left a
  "server info" script that prints basic deployment details.
  Your team lead needs it running in 5 minutes. It's broken.
  Fix it.
description: |
  The script should print the server name, port, and environment.
  It also exposes a get_server_info() function that returns a dict.

  There are 2 bugs:
    1. A variable name is used incorrectly (Python is case-sensitive!)
    2. You cannot concatenate a string and an integer with +
hints:
  - "Python variable names are case-sensitive. Check every usage of server_name."
  - "You can't do 'Port: ' + 8080. Use an f-string: f'Port: {port}'"
  - "The fix: change `server_Name` -> `server_name` and use an f-string for the port line."
tags:
  - variables
  - print
  - f-strings
  - types
