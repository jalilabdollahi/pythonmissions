title: "Parse Non-Empty Lines"
category: "Comprehensions"
difficulty: 1
xp: 100
story: |
  The log processor strips lines before checking if they're non-empty.
  Currently it strips twice — once to check, once to use.
description: |
  process_lines(lines) strips each line and keeps only non-empty ones.
  Bug: strip() is called twice — once in 'if' and once in the expression.
hints:
  - "The walrus operator := assigns and returns at the same time."
  - "Use: [stripped for line in lines if (stripped := line.strip())]."
  - "This strips once, assigns to 'stripped', and keeps if truthy."
tags:
  - comprehensions
  - walrus
  - efficiency
