title: "Write the Deploy Log"
category: "File I/O"
difficulty: 1
xp: 100
story: |
  The deploy logger opens the log file with 'r' mode and crashes
  when trying to write. Change the mode to append.
description: |
  write_log(path, message) appends message to the log file.
  Bug: open mode is 'r' (read) — should be 'a' (append).
hints:
  - "'r' opens for reading. 'a' opens for appending."
  - "To write without truncating, use mode='a'."
  - "Change open(path, 'r') to open(path, 'a')."
tags:
  - file-io
  - open
  - modes
